name: Runtime validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-bun-runtime.ts
      - run: bun run tsc --noEmit
      - run: bun run lint
      - run: bun run test --run
      # This only builds tooling and checks versions. Never invoke the Bonk
      # action, an agent, a provider, or publish an image.
      - run: docker build --pull -t runtime-validation .
      - run: docker run --rm runtime-validation sh -c 'test "$(node --version)" = v22.23.5 && test "$(bun --version)" = 1.4.4 && npm --version'
